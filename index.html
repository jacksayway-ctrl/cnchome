splay:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#tm-preview .panel{background:var(--tm-panel);border:1px solid var(--tm-line);border-radius:12px;padding:19px;margin-bottom:17px}#tm-preview .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:17px}#tm-preview .stat{background:var(--tm-panel);border:1px solid var(--tm-line);border-radius:12px;padding:17px}#tm-preview .stat .value{font-size:25px;font-weight:700;letter-spacing:-.6px;margin:5px 0;color:#173c70}#tm-preview .pill{display:inline-block;font-size:12px;border-radius:6px;padding:3px 7px;background:#eaf3ff;color:#1c5aaf;white-space:nowrap}#tm-preview .green{background:#e4f6ed;color:#22734f}#tm-preview .pink{background:#ffebf0;color:#ae3c64}#tm-preview .amber{background:#fff2d9;color:#886012}#tm-preview table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}#tm-preview th{color:#52667f;background:#f5f8fc;font-weight:600}#tm-preview th,#tm-preview td{padding:11px 10px;border-bottom:1px solid var(--tm-line);vertical-align:middle}#tm-preview .scroll{overflow-x:auto}#tm-preview .scroll table{min-width:470px}#tm-preview .notice{border-left:3px solid var(--tm-blue);padding:12px 15px;background:#f0f5ff;border-radius:0 8px 8px 0;margin-bottom:17px}#tm-preview .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}#tm-preview .weekday{text-align:center;color:var(--tm-muted);font-size:12px;padding:5px}#tm-preview .day{background:#fff;border:1px solid var(--tm-line);border-radius:7px;min-height:76px;padding:6px;text-align:left;color:var(--tm-ink)}#tm-preview .day.active{border:2px solid var(--tm-blue);background:#f2f7ff;padding:5px}#tm-preview .day small{display:block;font-size:11px;color:#556e8e}#tm-preview .day .count{color:var(--tm-blue);font-weight:600}#tm-preview .empty{min-height:76px}#tm-preview .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}#tm-preview input,#tm-preview select,#tm-preview textarea{border:1px solid #cdd9e7;background:#fff;color:var(--tm-ink);border-radius:7px;padding:9px 10px;max-width:100%;font-size:16px}#tm-preview .toolbar input{flex:1;min-width:150px}#tm-preview .track{height:9px;background:#e8eef7;border-radius:5px;overflow:hidden;margin:13px 0}#tm-preview .track span{height:100%;display:block;background:var(--tm-blue)}#tm-preview .chart{height:146px;display:flex;gap:5px;align-items:flex-end;border-bottom:1px solid var(--tm-line);padding-top:10px}#tm-preview .bar-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px}#tm-preview .bar-col button{width:100%;border:0;border-radius:4px 4px 0 0;background:#82b2ff;min-height:4px;padding:0}#tm-preview .bar-col button.selected{background:var(--tm-blue)}#tm-preview .bar-col small{font-size:10px;color:var(--tm-muted)}#tm-preview .legend{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--tm-muted);margin-top:7px}#tm-preview .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}#tm-preview label{display:grid;gap:5px;font-size:13px}#tm-preview dialog{color:var(--tm-ink);background:#fff;border:1px solid var(--tm-line);border-radius:14px;width:min(560px,90%);max-height:85vh;padding:24px}#tm-preview dialog::backdrop{background:#10284488}#tm-preview .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}#tm-preview .full{grid-column:1/-1}#tm-preview .toast{padding:10px 20px;background:#e6f5ee;color:#236443}#tm-preview .mobile-note{display:none}#tm-preview .money{font-variant-numeric:tabular-nums}#tm-preview .grade-table tr.chosen td{background:#edf4ff;color:#164f99;font-weight:600}

/* Keep navigation and header visible; scroll only the page content. */
html,body{height:100%;overflow:hidden}
#tm-preview{height:100vh;height:100dvh;border-radius:0}
#tm-preview .shell{height:100%;min-height:0;overflow:hidden}
#tm-preview aside{min-height:0;overflow-y:auto;overscroll-behavior:contain}
#tm-preview .work{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#tm-preview header,#tm-preview .sample,#tm-preview .toast{flex-shrink:0}
#tm-preview main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
@media(max-width:480px){
 #tm-preview .shell{display:grid;grid-template-columns:112px minmax(0,1fr)}
 #tm-preview aside{padding:14px 6px}
 #tm-preview .brand{font-size:15px;padding:0 4px 12px}
 #tm-preview nav{display:grid;gap:4px}
 #tm-preview nav button{padding:9px 7px}
 #tm-preview .mobile-note{display:none}
}

/* Persistent grade target/achievement summary beside the greeting. */
#tm-preview header{gap:18px}
#tm-preview .header-grades{margin-left:auto;min-width:310px;background:#f7faff;border:1px solid var(--tm-line);border-radius:10px;overflow:hidden}
#tm-preview .header-grades table{font-size:13px;line-height:1.4}
#tm-preview .header-grades th,#tm-preview .header-grades td{padding:7px 12px}
#tm-preview .header-grades th{background:#edf4ff}
#tm-preview .header-grades th:not(:first-child),#tm-preview .header-grades td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
#tm-preview .header-grades tbody tr:last-child td{border-bottom:0}
#tm-preview .header-grades .achieved{color:#1464ec;font-weight:700}
#tm-preview .header-grades caption{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%)}
@media(max-width:1000px){#tm-preview .header-grades{min-width:270px}#tm-preview header{gap:12px}}
@media(max-width:760px){#tm-preview .header-grades{order:3;width:100%;min-width:0}#tm-preview .header-grades th,#tm-preview .header-grades td{padding:5px 8px}#tm-preview header h1{font-size:18px}}
/* Horizontal grade summary. */
#tm-preview .header-grades{min-width:350px}
#tm-preview .header-grades table{table-layout:fixed}
#tm-preview .header-grades th,#tm-preview .header-grades td,#tm-preview .header-grades th:not(:first-child),#tm-preview .header-grades td:not(:first-child){text-align:center;padding:9px 10px;white-space:nowrap}

@media(max-width:760px){#tm-preview .header-grades{min-width:0}#tm-preview .header-grades th,#tm-preview .header-grades td{white-space:normal;padding:6px 4px}#tm-preview .header-grades td{font-size:14px}}

/* Align greeting and grade summary as one full-width header row. */
#tm-preview header{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;align-items:stretch;gap:24px}
#tm-preview header>div:first-child{display:flex;flex-direction:column;justify-content:center}
#tm-preview header h1{margin:0 0 5px}
#tm-preview .header-grades{width:100%;min-width:0;margin:0;align-self:stretch;border-radius:8px}
#tm-preview .header-grades table{height:100%;width:100%}
#tm-preview .header-grades th,#tm-preview .header-grades td,#tm-preview .header-grades th:not(:first-child),#tm-preview .header-grades td:not(:first-child){padding:6px 10px}
#tm-preview .header-grades th{font-size:13px}
#tm-preview .header-grades td{font-size:16px}
#tm-preview header>.action{align-self:center;white-space:nowrap}
@media(max-width:1000px){
 #tm-preview header{gap:14px}
 #tm-preview header h1{font-size:19px}
 #tm-preview header>.action{padding:9px 11px}
}
@media(max-width:760px){
 #tm-preview header{grid-template-columns:minmax(0,1fr) max-content;gap:12px}
 #tm-preview .header-grades{grid-column:1/-1;order:initial;min-height:58px}
 #tm-preview header>.action{grid-column:2;grid-row:1}
}

/* Salary cards and compact performance summary from the approved preview. */
#tm-preview .sales-pay .stats{gap:18px}
#tm-preview .sales-pay .stat{padding:24px 20px;min-height:176px;display:flex;flex-direction:column;justify-content:space-between}
#tm-preview .sales-pay .stat>.sub:first-child{font-size:15px;color:#425874}
#tm-preview .sales-pay .value{font-size:clamp(24px,2.4vw,36px);margin:16px 0;line-height:1.3;color:#102d51}
#tm-preview .sales-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:22px 0;margin-bottom:20px;border:1px solid var(--tm-line);border-radius:12px;background:var(--tm-panel)}
#tm-preview .sales-summary>div{padding:0 24px;display:flex;flex-direction:column;gap:8px}
#tm-preview .sales-summary>div+div{border-left:1px solid var(--tm-line)}
#tm-preview .sales-summary span{color:var(--tm-muted)}
#tm-preview .sales-summary strong{font-size:25px;color:#102d51}
@media(max-width:760px){#tm-preview .sales-pay .stat{min-height:140px}#tm-preview .sales-summary>div{padding:0 10px}#tm-preview .sales-summary strong{font-size:21px}}

#tm-preview .top-notice{display:flex;align-items:center;gap:14px;flex-shrink:0;min-width:0;padding:9px 26px;background:#edf4ff;border-bottom:1px solid #d9e6f9}
#tm-preview .top-notice strong{white-space:nowrap;color:#194d8f;font-size:13px}
#tm-preview .notice-message{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;padding:3px 0;text-align:left;color:#334f72;font-size:14px}
#tm-preview .notice-confirm{flex-shrink:0;white-space:nowrap;border:1px solid #b9cee9;border-radius:6px;background:#fff;color:#285486;padding:4px 9px;font-size:12px}

#tm-preview .calendar .weekday-red,#tm-preview .calendar .day-red .date-number,#tm-preview .calendar .holiday-name{color:#c52c3d}
#tm-preview .calendar .weekday-blue,#tm-preview .calendar .day-blue .date-number{color:#1464ec}
#tm-preview .calendar .holiday-name{font-weight:600;white-space:normal}
#tm-preview .calendar .day-red{background:#fff8f8}
#tm-preview .calendar .day.active{background:#f2f7ff}

#tm-preview .home-status-controls{display:flex;gap:10px;flex-wrap:wrap}
#tm-preview .home-status-button{border:1px solid transparent;border-radius:8px;padding:8px 13px;font-weight:600}
#tm-preview .home-status-button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:2px}

#tm-preview .comparison-legend{display:flex;flex-wrap:wrap;gap:20px;margin:12px 0 6px;color:#52667f;font-size:13px}

#tm-preview .comparison-scroll{overflow-x:auto}
#tm-preview .comparison-chart{width:100%;min-width:650px;display:block}
#tm-preview .chart-day-target{cursor:pointer}
#tm-preview .chart-day-target:hover,#tm-preview .chart-day-target:focus{fill:#1464ec0d;outline:none;stroke:#1464ec;stroke-width:1}

#tm-preview .my-grade-position{display:inline-flex;align-items:center;gap:4px;margin:4px 0 4px 10px;padding:3px 9px;border:1px solid #a9c9ff;border-radius:20px;background:#fff;color:#1457bb;font-size:12px;font-weight:600;white-space:nowrap}
</style>

<script>
(()=>{
const root=document.getElementById('tm-preview'), main=root.querySelector('#tm-main'), modal=root.querySelector('#tm-dialog'), body=root.querySelector('#tm-dialog-body');
const pageNames=['home','regions','attendance','sales','daily','weekly','monthly','as'];
function pageFromUrl(){const name=window.location.hash.slice(1);return pageNames.includes(name)?name:'home'}
let homeStatus=null;
let page=pageFromUrl(),selected=22,noticeRead=false,cashReceived=false,outing='none',clockedOut=false;
const performance={1:4,2:5,3:6,4:4,7:5,8:3,9:6,10:7,11:4,14:6,15:5,16:7,17:6,18:5,21:7,22:8};
const total=Object.values(performance).reduce((a,b)=>a+b,0);
root.querySelector('#tm-head-daily').textContent='6/'+performance[22];
root.querySelector('#tm-head-weekly').textContent='평균 6/'+Number(((performance[21]+performance[22])/5).toFixed(1));
root.querySelector('#tm-head-monthly').textContent=total<=60?'60건 이하':total<=70?'61~70건':total<=80?'71~80건':total<=90?'81~90건':total<=100?'91~100건':'101건 이상';
const names=['김예시','이예시','박예시','최예시','정예시','윤예시','장예시','한예시'];
const areas=['경기도 부천시','경기도 시흥시','경기도 고양시','충북 청주시','대전 서구','경기도 용인시','경기도 파주시','경남 창원시'];
const regions=[['부천시 · 시흥시','경기도','2 / 2','4 / 2','일반·실버 모두 확인','부천시 원미구 · 시흥시 정왕동'],['고양시 · 파주시','경기도','3 / 3','4 / 2','수도권 공유 수량','파주시 문산읍 · 고양시 덕양구'],['용인시 · 안성시','경기도','3 / 3','4 / 2','수도권 공유 수량','용인시 처인구 포곡읍 · 안성시 공도읍'],['충청북도','충청','3 / 3','1 / 1','대전·충청 공유 수량','청주시 오창읍 · 옥천군 옥천읍'],['대전 · 금산','충청','4 / 4','1 / 1','대전·충청 공유 수량','금산군 금산읍 · 대전 서구'],['창원시','경남','4 / 4','25 / 18','부산·울산·경남 공유 수량','창원시 의창구 북면'],['서울특별시','서울','0 / 0','4 / 2','수도권 공유 수량','서울 강남구 · 송파구']];
const fmt=n=>n.toLocaleString('ko-KR');
const pill=(s,c='')=>`<span class="pill ${c}">${s}</span>`;
const table=(heads,rows)=>`<div class="scroll"><table><thead><tr>${heads.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(s=>`<td>${s}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const panel=(title,content)=>`<section class="panel"><h2>${title}</h2>${content}</section>`;
const stats=items=>`<div class="stats">${items.map(([a,b,c])=>`<div class="stat"><div class="sub">${a}</div><div class="value money">${b}</div><div class="sub">${c}</div></div>`).join('')}</div>`;
const colleaguePerformance=[
 {name:'상담원 A · 예시',color:'#db7c25',values:{1:5,2:4,3:7,4:5,7:6,8:5,9:4,10:8,11:6,14:5,15:7,16:6,17:8,18:7,21:6,22:7}},
 {name:'상담원 B · 예시',color:'#8657bd',values:{1:3,2:6,3:5,4:6,7:4,8:6,9:5,10:5,11:7,14:7,15:4,16:8,17:5,18:6,21:8,22:6}}
];
function graph(){
 const width=900,height=260,left=58,right=16,top=40,bottom=38,plotHeight=height-top-bottom,step=(width-left-right)/30;
 const peak=Math.max(...Object.values(performance),...colleaguePerformance.flatMap(c=>Object.values(c.values)));
 const max=Math.max(2,Math.ceil((peak+1)/2)*2),x=d=>left+(d-.5)*step,y=n=>height-bottom-n/max*plotHeight;
 let grid='';for(let n=0;n<=max;n+=2){grid+=`<line x1="${left}" y1="${y(n)}" x2="${width-right}" y2="${y(n)}" stroke="#dfe7f1"/><text x="${left-10}" y="${y(n)+5}" text-anchor="end" fill="#61738b" font-size="14">${n}</text>`}
 const bars=Object.entries(performance).map(([d,n])=>`<rect x="${x(+d)-step*.28}" y="${y(n)}" width="${step*.56}" height="${height-bottom-y(n)}" rx="3" fill="${selected===+d?'#1464ec':'#94bdff'}"><title>9월 ${d}일 · 나 ${n}건</title></rect>`).join('');
 const lines=colleaguePerformance.map(c=>{const entries=Object.entries(c.values);return `<polyline points="${entries.map(([d,n])=>x(+d)+','+y(n)).join(' ')}" fill="none" stroke="${c.color}" stroke-width="1.3" stroke-opacity=".65"/>${entries.map(([d,n])=>`<circle cx="${x(+d)}" cy="${y(n)}" r="4" fill="${c.color}" stroke="#fff" stroke-width="1.5"><title>9월 ${d}일 · ${c.name} ${n}건</title></circle>`).join('')}`}).join('');
 const dates=Array.from({length:30},(_,i)=>{const d=i+1,dow=new Date(2026,8,d).getDay(),holiday=calendarHolidays['2026-09-'+String(d).padStart(2,'0')],rest=dow===0||dow===6||Boolean(holiday);return `<text x="${x(d)}" y="${height-15}" text-anchor="middle" fill="${rest?'#c52c3d':'#61738b'}" font-size="12" font-weight="${rest?600:400}">${d}<title>${holiday|| (rest?'주말 휴무':'영업일')}</title></text>`}).join('');
 const targets=Array.from({length:30},(_,i)=>{const d=i+1;return `<rect class="chart-day-target" data-chart-day="${d}" role="button" tabindex="0" aria-label="9월 ${d}일 ${d>22?'집계 전':'나 '+(performance[d]||0)+'건'+colleaguePerformance.map(c=>', '+c.name+' '+(c.values[d]||0)+'건').join('')}" x="${x(d)-step/2}" y="${top}" width="${step}" height="${plotHeight}" fill="transparent"><title>9월 ${d}일: ${d>22?'집계 전':'나 '+(performance[d]||0)+'건 / '+colleaguePerformance.map(c=>c.name+' '+(c.values[d]||0)+'건').join(' / ')}</title></rect>`}).join('');
 return panel('9월 실적',`<div class="row"><span class="sub">A/S 제외 · 정상 실적</span><span class="pill">내 누적 ${total}건</span></div><div class="comparison-legend"><span><b style="color:#1464ec">▮</b> 나 · 막대</span>${colleaguePerformance.map(c=>`<span><b style="color:${c.color}">●</b> ${c.name}</span>`).join('')}</div><div class="comparison-scroll"><svg class="comparison-chart" viewBox="0 0 ${width} ${height}" role="group" aria-label="나와 다른 직원의 9월 일별 정상 실적 비교, 왼쪽 축은 건수"><text x="8" y="18" fill="#61738b" font-size="13">건수</text>${grid}${bars}${lines}${dates}${targets}</svg></div><div class="legend"><span>9월 · 날짜</span><span>9월 ${selected}일: ${selected>22?'집계 전':'나 '+(performance[selected]||0)+'건 / '+colleaguePerformance.map(c=>c.name+' '+(c.values[selected]||0)+'건').join(' / ')}</span></div>`);
}

const calendarHolidays={'2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴'};
function calendar(){let cells='<div class="empty"></div><div class="empty"></div>';for(let d=1;d<=30;d++){const holiday=calendarHolidays['2026-09-'+String(d).padStart(2,'0')]||'',dow=new Date(2026,8,d).getDay();const status=holiday?'공휴일':d>22?'':dow===0||dow===6?'휴일':d===9?'조퇴':d===16?'휴가 2h':'출근';const color=holiday||dow===0?'day-red':dow===6?'day-blue':'';cells+=`<button class="day ${color} ${d===selected?'active':''}" data-day="${d}" aria-label="9월 ${d}일 ${holiday||status}, 정상 ${performance[d]||0}건"><span class="date-number">${d}</span>${holiday?`<small class="holiday-name">${holiday}</small>`:`<small>${status}</small>`}${performance[d]?`<small class="count">정상 ${performance[d]}</small>`:''}</button>`}return panel('나의 출결·실적 달력',`<div class="row" style="margin-bottom:12px"><span>2026년 9월</span><span class="sub">날짜를 선택해 상세 내역 확인</span></div><div class="calendar">${['일','월','화','수','목','금','토'].map((x,i)=>`<div class="weekday ${i===0?'weekday-red':i===6?'weekday-blue':''}">${x}</div>`).join('')}${cells}</div>`)}

function dayRows(){const n=performance[selected]||0;return panel(`9월 ${selected}일 접수 내역`,n?table(['고객명','전화번호','지역','상태'],Array.from({length:n},(_,i)=>[names[i],`010-****-${String(1200+i)}`,areas[i],pill('정상 접수','green')])):'<p class="sub">이 날짜에는 표시할 접수 내역이 없습니다.</p>')}

function homeStatusList(){
 if(!homeStatus)return '';
 let title,rows;
 if(homeStatus==='pending'){title='오늘 가접수 · 2건';rows=[['강예시','010-0000-1301','경기도 부천시 예시로 2',pill('가접수','pink')],['조예시','010-0000-1302','경기도 파주시 예시로 3',pill('가접수','pink')]]}
 else if(homeStatus==='normal'){title='오늘 정상 접수 · 8건';rows=Array.from({length:performance[22]},(_,i)=>[names[i],'010-****-'+String(1200+i),areas[i],pill('정상 접수','green')])}
 else{title='오늘 A/S · 1건';rows=[['김예시','010-0000-1200','경기도 부천시 예시로 1, 예시동 101호',pill('접수 중복','amber')]]}
 return panel(title,table(['고객명','전화번호','지역·주소',homeStatus==='as'?'A/S 사유':'상태'],rows));
}
function homeStatusButtons(){return `<div class="home-status-controls" role="group" aria-label="오늘 접수 상태별 목록">${[['pending','가접수 2건','pink'],['normal','정상 8건','green'],['as','A/S 1건','amber']].map(([key,label,color])=>`<button type="button" class="home-status-button ${color}" data-home-status="${key}" aria-pressed="${homeStatus===key}" aria-controls="tm-home-status-list">${label}</button>`).join('')}</div>`}
function home(){return `<div class="detail-grid">${panel('오늘 영업 현황',homeStatusButtons()+'<p class="sub">마지막 확인 16:40 · 예시 화면</p>')}${panel('오늘 출결',`<div class="row"><div><h2>10:00 출근</h2>${pill(clockedOut?'퇴근 기록됨':'근무 중','green')}</div><button class="secondary" data-action="clockout" ${clockedOut?'disabled':''}>퇴근하기</button></div>`)}</div><div id="tm-home-status-list" aria-live="polite">${homeStatusList()}</div>`+graph()+panel('팀 공통 그레이드 기준',`<div class="row"><span>일 · 6건부터 건당 5,000원</span><span>주 · 평균 6건부터 30,000원</span></div><div style="margin-top:16px"><h3>월그레이드 기준표</h3>${gradeTable()}</div>`)}

function regionPage(){return `<h2>접수 가능지역</h2><div class="toolbar"><input id="tm-region-search" aria-label="지역 검색" placeholder="시·군·구, 읍·면·동 검색"><select id="tm-age" aria-label="GA 구분"><option>GA 일반 · 60세 이하</option><option selected>GA 실버 · 61세 이상</option></select></div><div class="notice">표시: 오늘 배정 / 남은 수량 · 같은 묶음의 지역은 수량을 공유합니다.</div><section class="panel"><div id="tm-region-results"></div></section><p class="sub">예시 정책 · 신한은 등록된 정책이 없어 숨겨져 있습니다. 전국 지도 연동은 다음 화면 작업에서 반영할 예정입니다.</p>`}
function filterRegions(){const q=root.querySelector('#tm-region-search').value.trim(),general=root.querySelector('#tm-age').selectedIndex===0;const rows=regions.filter(r=>r.join(' ').includes(q));root.querySelector('#tm-region-results').innerHTML=table(['지역','한화','GA '+(general?'일반':'실버'),'적용 범위'],rows.map(r=>[r[0],pill(r[2],r[2]==='0 / 0'?'pink':'green'),general?pill('자료 대기','amber'):pill(r[3],'green'),r[4]]))+(rows.length?'':'<p>검색 결과가 없습니다.</p>')}
function attendance(){return `<h2>나의 출결</h2>`+stats([['오늘 출근','10:00',clockedOut?'퇴근 기록 완료':'정상 출근 · 기본 승인'],['오늘 예정 인정 시간','6시간','점심 제외 · 오후 휴식 포함'],['이번 달 인정 시간','92시간','9월 22일 기준 · 예시']])+panel('오늘 근무',`<div class="row"><span>${outing==='pending'?pill('외출 승인 대기','amber'):pill('근무 중','green')}</span><div class="row"><button class="secondary" data-action="outing" ${outing==='pending'?'disabled':''}>외출 신청</button><button class="action" data-action="clockout" ${clockedOut?'disabled':''}>${clockedOut?'퇴근 기록됨':'퇴근하기'}</button></div></div><p class="sub">외출은 사전 승인 후 시작할 수 있습니다.</p>`)+panel('출결 내역',table(['날짜','출근','퇴근','상태','인정 시간'],[['9월 22일','10:00',clockedOut?'16:40':'—',clockedOut?'퇴근':'근무 중',clockedOut?'6시간':'집계 중'],['9월 21일','10:00','17:00','출근','6시간'],['9월 18일','10:00','17:00','출근','6시간'],['9월 17일','10:10','17:00','지각 10분','6시간'],['9월 16일','10:00','15:00','휴가 2시간','근무 4 + 휴가 2'],['9월 9일','10:00','15:00','조퇴','4시간']]))+panel('외출 기록',outing==='pending'?table(['구분','예정 시간','상태'],[[root.dataset.outingKind||'개인 외출','관리자 확인 예정',pill('승인 대기','amber')]]):'<p class="sub">오늘 등록된 외출 기록이 없습니다.</p>')}
function sales(){return `<h2>나의 실적</h2>`+calendar()+`<div class="toolbar"><label>접수 상태<select id="tm-sales-filter"><option>정상 접수</option><option>가접수</option></select></label></div><div id="tm-sales-list">${dayRows()}</div>`+`<div class="sales-pay">`+stats([['오늘까지 근로 급여 · 세전','1,380,000원','인정 92시간 × 예시 시급 15,000원'],['이번 달 예상 급여 · 세전','2,120,000원','예시 132시간·현재 월 성과급 유지'],['오늘 일그레이드',cashReceived?'수령 완료':'15,000원','정상 8건 · 기준 6건부터 5,000원']])+`</div><section class="sales-summary" aria-label="이번 달 실적 요약"><div><span>9월 정상 실적</span><strong>${total}건</strong></div><div><span>가접수</span><strong>2건</strong></div><div><span>A/S</span><strong>3건</strong></div></section>`+graph()}
function daily(){return `<h2>일그레이드</h2>`+stats([['오늘 정상 실적','8건','팀 공통 기준 6건'],['오늘 발생 금액','15,000원','(8 − 6 + 1) × 5,000원'],['오늘 수령 금액',cashReceived?'15,000원':'0원',cashReceived?'직원 수령 확인 완료':'관리자 지급 승인 완료 · 예시']])+panel('오늘 현금 수령',`<div class="row"><div><h2>${cashReceived?'수령 확인이 완료되었습니다.':'15,000원 수령 대기'}</h2><div class="sub">현금을 실제 받은 후 확인해 주세요.</div></div><button class="action" data-action="cash" ${cashReceived?'disabled':''}>${cashReceived?'수령 완료':'수령 확인'}</button></div>`)+panel('날짜별 수령 내역',table(['날짜','발생 금액','수령 금액','상태'],[['9월 22일','15,000원',cashReceived?'15,000원':'0원',cashReceived?'수령 완료':'수령 대기'],['9월 21일','10,000원','10,000원','수령 완료'],['9월 17일','5,000원','5,000원','수령 완료']]))+`<div class="notice">이번 달 현금 보너스 수령 합계 <strong>${cashReceived?'30,000':'15,000'}원</strong> · 월 급여에 중복 지급하지 않습니다.</div>`}
function weekly(){return `<h2>주그레이드</h2>`+stats([['이번 주 정상 실적','15건','9월 21~25일 · 현재 2일 집계'],['근무가능일 기준 평균','3.0건','15건 ÷ 회사 근무가능일 5일'],['현재 달성 금액','0원','주간 집계 진행 중']])+panel('이번 주 달성 현황',`<div class="row"><span>첫 기준까지 15건 남음</span><strong>15 / 30건</strong></div><div class="track"><span style="width:50%"></span></div><p class="sub">개인 결근은 분모를 줄이지 않습니다. 회사 휴무일은 제외합니다.</p>`)+panel('팀 공통 지급 기준',table(['주간 평균','주그레이드'],[['6건 이상 ~ 7건 미만','30,000원'],['7건 이상 ~ 8건 미만','40,000원'],['8건 이상','50,000원']]))+panel('주별 내역',table(['기간','정상 실적','평균','발생 금액'],[['9월 7~11일','25건','5.0건','0원'],['9월 14~18일','29건','5.8건','0원'],['9월 21~25일','15건','3.0건','집계 중']]))+`<div class="notice">주그레이드는 월 급여에 포함해 정산합니다. 아직 끝나지 않은 주는 확정 금액이 아닙니다.</div>`}
function monthly(){return `<h2>월그레이드</h2>`+stats([['이번 달 정상 실적',`${total}건`,'A/S 제외'],['현재 구간 시급','15,000원','월 최종 실적에 따라 확정'],['현재 월 성과급','140,000원','달성 100,000 + 추가 40,000원']])+panel('다음 구간까지',`<div class="row"><strong>101건까지 ${101-total}건</strong><span>${total} / 101건</span></div><div class="track"><span style="width:${total/101*100}%"></span></div><p class="sub">101건 달성 시 시급 16,000원 · 달성 수당 300,000원</p>`)+panel('9월 적용 기준표',gradeTable())+panel('기준 적용 이력',table(['적용 기간','기준','상태'],[['9월 1~30일','보험팀 월그레이드 기준','적용 중']]))+`<p class="sub">표시는 예시입니다. 실제 정산에서는 교육·입퇴사·팀 이동·기준 변경 구간을 구분합니다.</p>`}
function asPage(){return `<h2>나의 A/S</h2>`+stats([['처리 필요','3건','중복 2 · 동의 답변 미흡 1'],['오늘 재콜 예정','1건','9월 22일 16:50'],['재콜 완료','1건','기존 A/S 기록 보존']])+panel('처리 내역',table(['고객','접수처','사유','상태','상세'],[['김예시','한화','접수 중복',pill('재콜 필요','amber'),'<button class="secondary" data-action="as-detail">보기</button>'],['이예시','GA 실버','접수 중복',pill('재콜 예정'),'<button class="secondary" data-action="as-detail">보기</button>'],['박예시','한화','동의 답변 미흡',pill('재콜 필요','amber'),'<button class="secondary" data-action="as-detail">보기</button>'],['최예시','GA 실버','접수 중복',pill('재콜 완료','green'),'010-****-1203']]))+`<p class="sub">진행 중인 A/S의 상세 화면에서 연락처를 확인할 수 있습니다. 재콜 완료 시 다시 가려집니다.</p>`}
function render(){const noticeButton=root.querySelector('.notice-confirm');noticeButton.disabled=noticeRead;noticeButton.textContent=noticeRead?'확인 완료':'확인했습니다';main.innerHTML=({home,regions:regionPage,attendance,sales,daily,weekly,monthly,as:asPage})[page]();root.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(page==='regions')filterRegions()}
function toast(s){const t=root.querySelector('#tm-toast');t.textContent=s;t.hidden=false}
function open(title,html){root.querySelector('#tm-dialog-title').textContent=title;body.innerHTML=html;modal.showModal()}
function intake(){open('보험 접수 등록',`<p class="sub">입력 체험용입니다. 실제 접수나 저장은 되지 않습니다.</p><form id="tm-intake-form"><div class="fields"><label>접수처<select required><option>한화</option><option>GA 일반</option><option>GA 실버</option></select></label><label>고객명<input required placeholder="예시 이름"></label><label>전화번호<input type="tel" required pattern="[0-9-]{10,13}" placeholder="010-0000-0000"></label><label>출생연도<input type="number" min="1920" max="2026" required placeholder="1965"></label><label class="full">상담받을 주소<input required placeholder="시·군·구 및 상세 주소"></label><label>통화 가능시간<input type="time" required></label><label>방문 가능시간<input type="time" required></label><label class="full">상담 메모<textarea rows="2"></textarea></label></div><button class="action" type="submit">입력 완료 체험</button></form>`)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.homeStatus){homeStatus=homeStatus===b.dataset.homeStatus?null:b.dataset.homeStatus;root.querySelectorAll('[data-home-status]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.homeStatus===homeStatus)));const target=root.querySelector('#tm-home-status-list');target.innerHTML=homeStatusList();return}if(b.dataset.page){if(window.location.hash==='#'+b.dataset.page){page=b.dataset.page;render();main.scrollTop=0}else{window.location.hash=b.dataset.page}return}if(b.dataset.day){selected=+b.dataset.day;render();return}switch(b.dataset.action){case 'close':modal.close();break;case 'intake':intake();break;case 'notice-detail':open('보험팀 중요 공지','<p>접수 가능지역을 확인한 후 상담해 주세요.</p>');break;case 'notice':noticeRead=true;render();toast('공지 확인 완료 · 미리보기에서만 반영됩니다.');break;case 'cash':open('현금 수령 확인',`<p>오늘 일그레이드 <strong>15,000원</strong>을 받으셨나요?</p><p class="sub">예시 수령 확인이며 실제 지급 기록은 생성되지 않습니다.</p><button class="action" data-action="confirm-cash">예시 수령 확인</button>`);break;case 'confirm-cash':cashReceived=true;modal.close();render();toast('예시 수령 확인 완료');break;case 'clockout':open('퇴근 기록 확인',`<p>예시 시각 <strong>16:40</strong>으로 퇴근을 기록합니다.</p><p class="sub">점심 제외 5시간 40분 → 인정 6시간</p><button class="action" data-action="confirm-clockout">예시 퇴근 확인</button>`);break;case 'confirm-clockout':clockedOut=true;modal.close();render();toast('퇴근 기록 체험 완료');break;case 'outing':open('외출 사전 승인 신청',`<form id="tm-outing-form"><div class="fields"><label>외출 구분<select name="kind"><option>개인 외출</option><option>업무 외출</option></select></label><label>예정일<input type="date" value="2026-09-22" required></label><label>외출 예정<input type="time" name="start" required></label><label>복귀 예정<input type="time" name="end" required></label><label class="full">사유<textarea required rows="2"></textarea></label></div><p class="sub">승인 후 외출 시작이 가능합니다.</p><button type="submit" class="action">신청 체험</button></form>`);break;case 'as-detail':open('진행 중인 A/S · 예시 상세',`<p><strong>김예시</strong> · 한화</p><p>전화번호: 010-0000-1200</p><p>주소: 경기도 부천시 예시로 1, 예시동 101호</p><p>${pill('접수 중복','amber')}</p><label>재콜 예정 시각<input type="datetime-local" value="2026-09-22T16:50"></label><p class="sub">표시된 연락처와 주소는 가상 자료입니다.</p><button class="action" data-action="recall">재콜 일정 확인 체험</button>`);break;case 'recall':modal.close();toast('재콜 일정 확인 체험 완료 · 실제로 저장되지 않습니다.');break;}});
root.addEventListener('input',e=>{if(e.target.id==='tm-region-search')filterRegions()});
root.addEventListener('change',e=>{if(e.target.id==='tm-age')filterRegions();if(e.target.id==='tm-sales-filter'){root.querySelector('#tm-sales-list').innerHTML=e.target.selectedIndex?panel('가접수 · 승인 대기',table(['고객','전화번호','지역','상태'],[['강예시','010-0000-1301','경기도 부천시 예시로 2',pill('가접수','pink')],['조예시','010-0000-1302','경기도 파주시 예시로 3',pill('가접수','pink')]])):dayRows()}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='tm-outing-form'){const f=new FormData(e.target);if(f.get('end')<=f.get('start')){toast('복귀 예정 시간은 외출 예정 시간 이후로 입력해 주세요.');return}outing='pending';root.dataset.outingKind=f.get('kind');modal.close();render();toast('외출 신청 체험 완료 · 관리자 승인 대기 상태입니다.')}else if(e.target.id==='tm-intake-form'){modal.close();toast('접수 입력 체험 완료 · 실제 접수·수량·실적에는 반영되지 않습니다.')}});
root.addEventListener('click',e=>{const target=e.target.closest('[data-chart-day]');if(target){selected=Number(target.dataset.chartDay);render()}});
root.addEventListener('keydown',e=>{const target=e.target.closest('[data-chart-day]');if(target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selected=Number(target.dataset.chartDay);render()}});
window.addEventListener('hashchange',()=>{page=pageFromUrl();render();main.scrollTop=0});
render();
})();
</script>
</div>

</body></html>
